<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPv4 3D Experience</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffcc;
            font-size: 1.2rem;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.5s ease;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            font-size: 0.9rem;
            user-select: none;
        }
    </style>
</head>

<body>

    <div id="loading">Cargando Activos 3D...</div>
    <div id="canvas-container"></div>
    <div class="ui-overlay">Mueve el mouse para interactuar • Scroll para Zoom</div>

    <!-- Import map para usar módulos de Three.js modernos -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        // --- Configuración de la Escena ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        // Cámara
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        // --- Post-Processing (Efecto Bloom/Resplandor) ---
        const renderScene = new RenderPass(scene, camera);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0;
        bloomPass.strength = 1.2; // Intensidad del brillo
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Controles ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.enablePan = false;

        // --- Luces ---
        const ambientLight = new THREE.AmbientLight(0x404040, 1); // Luz base suave
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ffff, 2, 100); // Cian
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff00ff, 2, 100); // Magenta
        pointLight2.position.set(-10, -10, 10);
        scene.add(pointLight2);

        // Luz dinámica que sigue al mouse (simulada)
        const mouseLight = new THREE.PointLight(0xffffff, 1, 50);
        scene.add(mouseLight);

        // --- Objetos ---

        // 1. Cargar Fuente y Crear Texto
        const loader = new FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {

            const textGeo = new TextGeometry('IPv4', {
                font: font,
                size: 6,
                height: 1.5, // Grosor
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.1,
                bevelSize: 0.05,
                bevelOffset: 0,
                bevelSegments: 5
            });

            textGeo.computeBoundingBox();
            const centerOffset = - 0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            textGeo.translate(centerOffset, 0, 0);

            // Material "Super Moderno"
            const materialFront = new THREE.MeshPhysicalMaterial({
                color: 0x000000,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0x001133,
                emissiveIntensity: 0.2,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });

            const materialSide = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                emissive: 0x0088ff,
                emissiveIntensity: 0.8, // Bordes brillantes
                metalness: 1,
                roughness: 0.2
            });

            const textMesh = new THREE.Mesh(textGeo, [materialFront, materialSide]);
            scene.add(textMesh);

            // Ocultar loading
            document.getElementById('loading').style.opacity = 0;
        });

        // 2. Grid de suelo estilo Cyberpunk
        const gridHelper = new THREE.GridHelper(100, 50, 0x00ffff, 0x111111);
        gridHelper.position.y = -5;
        scene.add(gridHelper);

        // 3. Partículas de fondo
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 700;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            // Esparcir partículas en un rango amplio
            posArray[i] = (Math.random() - 0.5) * 80;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- Animación y Eventos ---

        // Mouse interactivo
        const mouse = new THREE.Vector2();
        const target = new THREE.Vector2();
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX - windowHalfX);
            mouse.y = (event.clientY - windowHalfY);
        });

        // Redimensionar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            controls.update();

            // Animar luces
            pointLight1.position.x = Math.sin(elapsedTime * 0.7) * 20;
            pointLight1.position.z = Math.cos(elapsedTime * 0.7) * 20;
            pointLight1.position.y = Math.sin(elapsedTime * 0.3) * 10;

            pointLight2.position.x = Math.sin(elapsedTime * 0.5 + Math.PI) * 20;
            pointLight2.position.z = Math.cos(elapsedTime * 0.5 + Math.PI) * 20;

            // Luz del mouse con delay suave
            target.x = mouse.x * 0.05;
            target.y = -mouse.y * 0.05;
            mouseLight.position.x += (target.x - mouseLight.position.x) * 0.1;
            mouseLight.position.y += (target.y - mouseLight.position.y) * 0.1;
            mouseLight.position.z = 15;

            // Animar partículas suavemente
            particlesMesh.rotation.y = elapsedTime * 0.05;
            particlesMesh.rotation.x = elapsedTime * 0.02;

            // Usar composer para el efecto Bloom en lugar del renderer normal
            composer.render();
        }

        animate();
    </script>
</body>

</html>
